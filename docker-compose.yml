    networks:
      - exam-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam-backend
    restart: unless-stopped
    environment:
      APP_NAME: ExamSystem
      APP_ENV: local
      APP_KEY: base64:dGVzdGluZ2tleWZvcnRoZWV4YW1zeXN0ZW0=
      APP_DEBUG: true
      APP_URL: http://localhost:9000
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: exam_system
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/storage/logs
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - exam-network
    ports:
      - "9000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:9000/api
    depends_on:
      - backend
    networks:
      - exam-network
    ports:
      - "8080:80"

networks:
  exam-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local
